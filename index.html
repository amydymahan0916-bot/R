<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آذین سنگ | روشویی دست‌ساز</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#f4f1eb;
    color:#222;
}

header{
    height:70px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 7%;
    box-shadow:0 2px 15px #0001;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.logo span{color:#a77b35}

.hero{
    min-height:calc(100vh - 70px);
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:30px;
    background:
    linear-gradient(#0008,#0008),
    url("images/arsila.jpg") center/cover;
    color:white;
}

.content{
    max-width:750px;
}

h1{
    font-size:55px;
    margin-bottom:20px;
}

h1 span{color:#e3bb73}

.intro{
    font-size:18px;
    line-height:2.2;
    margin-bottom:35px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    text-decoration:none;
    padding:16px 28px;
    border-radius:13px;
    font-weight:bold;
    transition:.2s;
}

.btn:hover{transform:translateY(-3px)}

.gold{
    background:#b88a42;
    color:white;
}

.white{
    background:white;
    color:#222;
}

footer{
    position:absolute;
    bottom:15px;
    width:100%;
    text-align:center;
    color:#ddd;
    font-size:13px;
}

@media(max-width:600px){
    h1{font-size:40px}
    .intro{font-size:15px}
}
</style>
</head>

<body>

<header>
    <div class="logo">
        آذین <span>سنگ</span>
    </div>
</header>

<main class="hero">

    <div class="content">

        <h1>
            آذین <span>سنگ</span>
        </h1>

        <p class="intro">
            تولید و طراحی روشویی‌های سنگی دست‌ساز
            با امکان ساخت در طرح، فرم و ابعاد دلخواه شما.
            <br>
            هر طرحی که بخواهید، برای شما اجرا می‌کنیم.
        </p>

        <div class="buttons">

            <a href="products.html" class="btn gold">
                نمونه کارها
            </a>

            <a href="contact.html" class="btn white">
                تماس با پشتیبانی
            </a>

            <a href="address.html" class="btn white">
                آدرس
            </a>

        </div>

    </div>

</main>

<footer>
    آذین سنگ | بندر ماهشهر
</footer>

</body>
</html>
